name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  layers:
    name: test_${{ matrix.layer }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layer: [fp, poly, curve, pairing, g2_check, binding, groth16, inputs2, inputs]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/harness
      - run: make test-${{ matrix.layer }}

  # The plain Python reference.
  reference:
    name: test_bn254_ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install py_ecc
      - run: make test-bn254_ref

  # The committed example program and witness regenerate byte for byte.
  example:
    name: example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make example

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install ruff==0.16.8 mypy==2.3.1
      # a fixed Rust, so that a new clippy lint does not fail the build by itself
      - run: rustup toolchain install 1.97.0 --profile minimal -c clippy,rustfmt && rustup default 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/harness
      - run: make lint
