[package]
name = "groth-harness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "groth_harness"
path = "src/lib.rs"

[[bin]]
name = "hand"
path = "src/bin/hand.rs"

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"

[dependencies]
# simplicity-lang 0.9.0 is the version whose cost model and encoding the generators follow
simplicity-lang = { version = "0.9.0", features = ["human_encoding", "elements"] }
serde_json = "1"
